name: Textify desktop

on:
  push:
    paths: ['electron/**', 'models/**', 'LICENSE', 'THIRD_PARTY_LICENSES/**', 'Vendor/whisper.cpp/LICENSE', '.github/workflows/electron.yml']
  pull_request:
    paths: ['electron/**', 'models/**', 'LICENSE', 'THIRD_PARTY_LICENSES/**', 'Vendor/whisper.cpp/LICENSE', '.github/workflows/electron.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Hosted macOS exposes a paravirtual device without required SIMD support.
      # Physical GPU recognition is a separate device check on every platform.
      TEXTIFY_EXPECT_NO_GPU: '1'
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxtst-dev libxinerama-dev libxrandr-dev libasound2t64 libgbm1 xvfb libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verified Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkVersion = '1.4.357.0'
          $sdkInstaller = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/vulkansdk-windows-X64-$sdkVersion.exe" -OutFile $sdkInstaller
          if ((Get-FileHash $sdkInstaller -Algorithm SHA256).Hash.ToLower() -ne '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d') { throw 'Vulkan SDK checksum mismatch' }
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          $install = Start-Process $sdkInstaller -ArgumentList @('--root', $sdkRoot, '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Vulkan SDK installation failed' }
          "VULKAN_SDK=$sdkRoot" | Out-File $env:GITHUB_ENV -Append
          (Join-Path $sdkRoot 'Bin') | Out-File $env:GITHUB_PATH -Append
      - run: npm ci
      - run: npm run native:prepare
      - run: npm run native:build
      - run: npm run check
      - name: Prepare verified transcription fixture
        run: node scripts/prepare-smoke.mjs
      - name: Refuse CPU fallback on GPU-less runners
        run: node scripts/no-gpu-smoke.mjs
      - name: Electron smoke
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Electron smoke under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke
      - name: Windows native insertion and clipboard checks
        if: runner.os == 'Windows'
        run: node scripts/insertion-smoke.mjs
      - run: npm run package:preview
      - name: Verify signed microphone capability
        if: runner.os == 'macOS'
        run: node scripts/mac-signature-smoke.mjs 'release/mac-arm64/Textify.app'
      - name: Packaged macOS smoke
        if: runner.os == 'macOS'
        run: node scripts/packaged-smoke.mjs 'release/mac-arm64/Textify.app/Contents/MacOS/Textify'
      - name: Packaged Windows smoke
        if: runner.os == 'Windows'
        run: node scripts/packaged-smoke.mjs 'release/win-unpacked/Textify.exe'
      - name: Packaged Linux smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/packaged-smoke.mjs 'release/linux-unpacked/textify-electron'
      # Windows and Linux build the release configuration with its update feed.
      # A Mac release needs the maintainer's Developer ID, so CI builds a preview.
      - name: Build installers
        run: npm run ${{ runner.os == 'macOS' && 'dist:preview' || 'dist' }} -- --publish never
      - name: Test Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release -Filter '*win-x64.exe' | Select-Object -First 1).FullName
          $installDirectory = Join-Path $env:RUNNER_TEMP 'TextifyInstall'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Windows installation failed' }
          node scripts/packaged-smoke.mjs (Join-Path $installDirectory 'Textify.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows app failed' }
          if (-not (Select-String -LiteralPath (Join-Path $installDirectory 'resources\app-update.yml') -Pattern 'SignPath Foundation' -Quiet)) { throw 'The installed app does not check its update publisher' }
          $uninstaller = (Get-ChildItem $installDirectory -Filter 'Uninstall*.exe' | Select-Object -First 1).FullName
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
      - name: Test Debian installation and AppImage extraction
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y "$PWD"/release/*.deb
          xvfb-run --auto-servernum node scripts/packaged-smoke.mjs "$(command -v textify-electron)"
          grep -q 'provider: github' "$(dirname "$(readlink -f "$(command -v textify-electron)")")/resources/app-update.yml"
          mkdir -p .native/appimage-check
          image=$(realpath release/*.AppImage)
          chmod +x "$image"
          (cd .native/appimage-check && "$image" --appimage-extract > /dev/null)
          xvfb-run --auto-servernum node scripts/packaged-smoke.mjs .native/appimage-check/squashfs-root/textify-electron
          grep -q 'provider: github' .native/appimage-check/squashfs-root/resources/app-update.yml
          sudo apt-get remove -y textify-electron
      - name: Test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p .native/mounted-dmg
          hdiutil attach release/*.dmg -readonly -nobrowse -mountpoint .native/mounted-dmg
          trap 'hdiutil detach .native/mounted-dmg' EXIT
          node scripts/packaged-smoke.mjs '.native/mounted-dmg/Textify.app/Contents/MacOS/Textify'
      - name: Add checksums and installation notes
        run: node scripts/checksums.mjs
      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: textify-desktop-${{ matrix.os }}
          path: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.blockmap
            electron/release/*.yml
            !electron/release/builder-debug.yml
            electron/release/SHA256SUMS.txt
            electron/release/PREVIEW_INSTALL.md
          retention-days: 7
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-checks-${{ matrix.os }}
          path: electron/artifacts/
          retention-days: 7

  # A release tag's Windows installer is signed with SignPath Foundation's
  # certificate. Each request waits for a maintainer to approve it in SignPath.
  sign-windows:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-2025
    environment: release
    timeout-minutes: 150
    permissions:
      contents: read
      # SignPath downloads the unsigned installer with this job's token.
      actions: read
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      # The feed script needs only electron-builder's JavaScript.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: textify-desktop-windows-2025
          path: electron/release
      - name: Upload the installer for signing
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: textify-windows-unsigned
          path: electron/release/*.exe
          retention-days: 1
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: electron/signed
      - name: Check the signature
        shell: pwsh
        run: |
          Move-Item signed\*.exe release -Force
          $installer = (Get-ChildItem release -Filter '*win-x64.exe' | Select-Object -First 1).FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Signature status: $($signature.Status)" }
          $subject = $signature.SignerCertificate.Subject
          if ($subject -notmatch '(^|, )CN=SignPath Foundation(,|$)') { throw "Unexpected signer: $subject" }
          "Signed by $subject"
      - name: Update the feed and checksums
        run: |
          node scripts/signed-windows-feed.mjs
          node scripts/checksums.mjs
      - name: Upload the signed installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: textify-windows-signed
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/*.yml
            electron/release/SHA256SUMS.txt
          retention-days: 7
