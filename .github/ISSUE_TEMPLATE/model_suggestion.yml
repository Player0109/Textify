name: Model Suggestion
description: Suggest an on-device speech model for Textify's signed catalog.
title: "[Model]: "
labels:
  - model-suggestion
body:
  - type: markdown
    attributes:
      value: |
        Model suggestions are reviewed by maintainers and added at their discretion based on license compatibility, quality, and fit. Filing this issue does not guarantee inclusion or a timeline.

        Textify supports Whisper on all three desktop platforms, plus Parakeet, Qwen3-ASR, and Confucius4-R2T2 on Apple Silicon. Do not attach or submit model binaries. Textify maintainers obtain eligible artifacts directly from their authoritative upstream source.
  - type: input
    id: model_name
    attributes:
      label: Model name
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: Link to the authoritative upstream model page or repository.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: source_revision
    attributes:
      label: Source revision
      description: Provide an immutable release, tag, or full commit SHA when known.
      placeholder: "Release, tag, or full commit SHA"
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: Include the SPDX identifier when known.
      placeholder: "MIT"
    validations:
      required: true
  - type: input
    id: approximate_size
    attributes:
      label: Approximate size
      placeholder: "500 MB"
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Supported languages
      placeholder: "English"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why should Textify consider it?
      description: Explain its quality, latency, hardware requirements, and fit for short dictation.
    validations:
      required: true
  - type: textarea
    id: runtime_compatibility
    attributes:
      label: Runtime compatibility
      description: Name the Textify-supported local runtime that can execute the exact artifact, or explain what new runtime work would be required.
      placeholder: "Runtime, artifact format, and required integration"
    validations:
      required: true
  - type: input
    id: tested_hardware
    attributes:
      label: Tested platform and hardware
      description: Name the operating system, GPU, and runtime you tested, or enter "Not tested".
      placeholder: "macOS / Apple M2 / Metal, or Not tested"
    validations:
      required: true
