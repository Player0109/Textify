name: Bug Report
description: Report a reproducible problem in Textify.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste dictated text, clipboard contents, window titles, document names, URLs, diagnostics secrets, or other private content.

        Please copy the model name and version from Textify's Transcription models page. Available models depend on your platform.
  - type: input
    id: textify_version
    attributes:
      label: Textify version
      placeholder: "0.2.0-preview.23"
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      placeholder: "macOS 14.6.1, Windows 11, or Ubuntu 24.04 (GNOME Wayland)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Computer, processor, and GPU
      placeholder: "MacBook Air / Apple M2, or processor / GPU / graphics driver version"
    validations:
      required: true
  - type: input
    id: transcription_model
    attributes:
      label: Transcription model
      description: Copy the model name and version from Transcription models. Enter "Not sure" if unavailable.
      placeholder: "Whisper small.en / GGML Q5_1"
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: Dictation trigger
      options:
        - Right Command
        - Right Option
        - Right Control
        - Control + Space
        - Desktop shortcut portal (Wayland)
        - In-app microphone button
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: target_app
    attributes:
      label: Target app
      description: Select the app involved, if relevant.
      options:
        - Not applicable
        - TextEdit
        - Notes
        - Mail
        - Safari
        - Chrome
        - Slack
        - Messages
        - Terminal
        - VS Code
        - Pages
        - Microsoft Word
        - Other
    validations:
      required: true
  - type: input
    id: target_app_other
    attributes:
      label: Other target app
      description: App name only. Do not include window titles, document names, URLs, or dictated text.
      placeholder: App name
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the behavior without including dictated text or private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use placeholder text instead of real dictated or clipboard content.
      placeholder: |
        1. Open ...
        2. Hold ...
        3. Observe ...
    validations:
      required: true
  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include dictated text, clipboard contents, window titles, document names, URLs, or credentials.
          required: true
