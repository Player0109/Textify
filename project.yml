name: Textify

options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64

packages:
  TextifyPackage:
    path: .

targets:
  Textify:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Sources/Textify
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: ACKNOWLEDGMENTS.md
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES
        buildPhase: resources

    dependencies:
      - package: TextifyPackage
        product: TextifyCore
      - package: TextifyPackage
        product: TextifyAudio
      - package: TextifyPackage
        product: TextifyTranscription
      - package: TextifyPackage
        product: TextifyModels
      - package: TextifyPackage
        product: TextifyInsertion
      - package: TextifyPackage
        product: TextifyHotkeys
      - package: TextifyPackage
        product: TextifyDiagnostics
      - package: TextifyPackage
        product: TextifyRuntime
      - package: TextifyPackage
        product: TextifySettings

    settings:
      base:
        PRODUCT_NAME: Textify
        PRODUCT_BUNDLE_IDENTIFIER: io.github.Player0109.Textify
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Textify.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ARCHS: arm64
        SUPPORTED_PLATFORMS: macosx
        SDKROOT: macosx
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.1.0"
        TEXTIFY_SOURCE_COMMIT: local-development-not-for-release
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Textify.Local.entitlements
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO

    postBuildScripts:
      - name: Embed Signed Model Catalog
        script: |
          CATALOG_DIRECTORY="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ModelCatalog"
          mkdir -p "$CATALOG_DIRECTORY"
          /bin/cp "$SRCROOT/models/manifest.json" "$CATALOG_DIRECTORY/manifest.json"
          /bin/cp "$SRCROOT/models/manifest.json.sig" "$CATALOG_DIRECTORY/manifest.json.sig"
          /bin/cp "$SRCROOT/models/revocations.json" "$CATALOG_DIRECTORY/revocations.json"
          /bin/cp "$SRCROOT/models/revocations.json.sig" "$CATALOG_DIRECTORY/revocations.json.sig"
          SOURCE_COMMIT="${TEXTIFY_SOURCE_COMMIT:-local-development-not-for-release}"
          if ! printf '%s\n' "$SOURCE_COMMIT" \
            | /usr/bin/grep -Eq '^(local-development-not-for-release|[0-9a-f]{40})$'; then
            echo "Invalid Textify source commit identity: $SOURCE_COMMIT" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy \
            -c "Set :TextifySourceCommit $SOURCE_COMMIT" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
        inputFiles:
          - $(SRCROOT)/models/manifest.json
          - $(SRCROOT)/models/manifest.json.sig
          - $(SRCROOT)/models/revocations.json
          - $(SRCROOT)/models/revocations.json.sig
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ModelCatalog/manifest.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ModelCatalog/manifest.json.sig
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ModelCatalog/revocations.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ModelCatalog/revocations.json.sig
      - name: Compile Whisper Metal Library
        script: |
          "$SRCROOT/script/build_whisper_metallib.sh" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/default.metallib"
        inputFiles:
          - $(SRCROOT)/script/build_whisper_metallib.sh
          - $(SRCROOT)/Vendor/whisper.cpp/ggml/src/ggml-metal/ggml-metal.metal
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/default.metallib
      - name: Embed MLX Metal Library
        script: |
          "$SRCROOT/script/runtime/embed_mlx_metallib.sh" \
            "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/mlx.metallib" \
            "${EXPANDED_CODE_SIGN_IDENTITY:--}"
        inputFiles:
          - $(SRCROOT)/script/runtime/embed_mlx_metallib.sh
          - $(SRCROOT)/Vendor/mlx-swift/0.31.3/mlx.metallib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/mlx.metallib
      - name: Embed sherpa-onnx Runtime
        script: |
          "$SRCROOT/script/runtime/embed_sherpa_runtime.sh" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH" \
            "${EXPANDED_CODE_SIGN_IDENTITY:--}"
        inputFiles:
          - $(SRCROOT)/script/runtime/embed_sherpa_runtime.sh
          - $(SRCROOT)/Vendor/sherpa-onnx/v1.13.2/lib/libsherpa-onnx-c-api.dylib
          - $(SRCROOT)/Vendor/sherpa-onnx/v1.13.2/lib/libonnxruntime.1.24.4.dylib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libsherpa-onnx-c-api.dylib
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libonnxruntime.1.24.4.dylib
      - name: Embed transcribe.cpp Runtime
        script: |
          "$SRCROOT/script/runtime/embed_transcribe_cpp_runtime.sh" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH" \
            "${EXPANDED_CODE_SIGN_IDENTITY:--}"
        inputFiles:
          - $(SRCROOT)/script/runtime/embed_transcribe_cpp_runtime.sh
          - $(SRCROOT)/Vendor/transcribe.cpp/v0.1.3/lib/libtextify-transcribe.0.1.3.dylib
          - $(SRCROOT)/Vendor/transcribe.cpp/v0.1.3/EXPORTED_SYMBOLS
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libtextify-transcribe.0.1.3.dylib
      - name: Thin and Sign LiteRT-LM Runtime
        script: |
          "$SRCROOT/script/runtime/embed_litert_lm_runtime.sh" \
            "$BUILT_PRODUCTS_DIR/libCLiteRTLM_mac.dylib" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH" \
            "${EXPANDED_CODE_SIGN_IDENTITY:--}"
          touch "$DERIVED_FILE_DIR/litert-lm-runtime.stamp"
        inputFiles:
          - $(SRCROOT)/script/runtime/embed_litert_lm_runtime.sh
          - $(BUILT_PRODUCTS_DIR)/libCLiteRTLM_mac.dylib
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libCLiteRTLM_mac.dylib
        outputFiles:
          - $(DERIVED_FILE_DIR)/litert-lm-runtime.stamp

schemes:
  Textify:
    build:
      preActions:
        - name: Prepare SwiftPM Metal Headers
          settingsTarget: Textify
          script: |
            mkdir -p "${BUILT_PRODUCTS_DIR}/include"
            cp "${PROJECT_DIR}/Vendor/whisper.cpp/ggml/src/ggml-common.h" "${BUILT_PRODUCTS_DIR}/include/ggml-common.h"
      targets:
        Textify: all
    run:
      config: Debug
    archive:
      config: Release
